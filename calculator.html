<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Calculator - Math Magician</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <header>
        <h1>Math Magician</h1>

        <nav>
            <a href="index.html">Home</a>
            <a href="calculator.html">Calculator</a>
            <a href="quote.html">Quote</a>
        </nav>
    </header>

    <main class="calculator-page">

        <div class="calculator-title">
            <h2>Calculator</h2>
        </div>

        <div class="calculator">

            <div class="display">
                <span id="display">0</span>
            </div>

            <div class="buttons">

                <button class="gray" onclick="clearDisplay()">AC</button>
                <button class="gray" onclick="deleteNumber()">⌫</button>
                <button class="gray" onclick="percent()">%</button>
                <button class="orange" onclick="chooseOperator('/')">÷</button>

                <button onclick="addNumber('7')">7</button>
                <button onclick="addNumber('8')">8</button>
                <button onclick="addNumber('9')">9</button>
                <button class="orange" onclick="chooseOperator('*')">×</button>

                <button onclick="addNumber('4')">4</button>
                <button onclick="addNumber('5')">5</button>
                <button onclick="addNumber('6')">6</button>
                <button class="orange" onclick="chooseOperator('-')">−</button>

                <button onclick="addNumber('1')">1</button>
                <button onclick="addNumber('2')">2</button>
                <button onclick="addNumber('3')">3</button>
                <button class="orange" onclick="chooseOperator('+')">+</button>

                <button class="zero" onclick="addNumber('0')">0</button>
                <button onclick="addNumber('.')">.</button>
                <button class="orange" onclick="calculate()">=</button>

            </div>
        </div>

    </main>

    <script src="script.js"></script>

</body>
</html>
